name: Golang CF Scanning

on:
  workflow_dispatch: # Manual saja, jalan saat diminta

jobs:
  scan-proxies:
    runs-on: ubuntu-latest
    name: 🔎 Scan Proxy Go

    steps:
    - name: 📂 Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN_MASUK }}

    - name: 🛠️ Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: 🔑 Create keys.json from Secrets
      run: |
        echo "{\"WORKER_URLS\": \"${{ secrets.WORKER_URLS }}\"}" > keys.json
        echo "✅ keys.json created"

    - name: 🚀 Run Scanner
      run: |
        go run .

    - name: 📤 Commit Results
      if: success()
      run: |
        git config --global user.name "Github Actions"
        git config --global user.email "actions@github.com"
        git add Data/alive.txt
        git commit -m "🐦‍🔥 Update Proxy: alive.txt (live + org)" || echo "No changes to commit"
        git push origin main
