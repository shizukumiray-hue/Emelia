name: 🔄 Proxy Scanner - Daily Telegram Fetch & Push to A

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repo B
        uses: actions/checkout@v4

      - name: 🛠️ Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 📡 Fetch Proxies from Telegram
        run: |
          mkdir -p Data
          go run *.go -fetch zip_cm_edu_kg -output Data/telegram_fetch.txt || true

      - name: 📤 Push to Repo A (Emilia)
        env:
          TOKEN: ${{ secrets.TOKEN_AKUN_A }}
        run: |
          if [ -s Data/telegram_fetch.txt ]; then
            git clone https://x-access-token:${TOKEN}@github.com/papapapapdelesia/Emilia.git repo_a
            cp Data/telegram_fetch.txt repo_a/Data/active_from_b.txt
            cd repo_a
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Data/active_from_b.txt
            git commit -m "Update proxies from Telegram (Repo B)" && git push || echo "No changes"
          else
            echo "No proxies fetched, skipping push."
          fi
